[build]
  # Temporary defensive guard: Netlify is retired in favor of Vercel for all
  # applications. This file exists only to suppress builds from the legacy Git
  # integration until the project is disconnected in the Netlify dashboard.
  # Netlify interprets exit code 0 from the ignore command as "skip this build".
  ignore = "exit 0"
  command = "pnpm --filter @khlim/admin build"
  publish = "apps/admin/out"

[build.environment]
  NODE_VERSION = "24"
  CLOUDFLARE_PAGES = "1"
  NEXT_PUBLIC_ADMIN_DEMO_MODE = "true"
