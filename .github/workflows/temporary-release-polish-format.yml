name: Scoped visual polish formatter (temporary)
on:
  push:
    branches:
      - antigravity/web-uniform-gallery-grids-20261023
    paths:
      - .github/workflows/temporary-release-polish-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: antigravity/web-uniform-gallery-grids-20261023
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run repo formatter
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write apps/web/components/layout/public-header.tsx tests/web-release-navigation-polish.test.mjs
          git diff --check
      - name: Commit formatting-only adjustment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/components/layout/public-header.tsx tests/web-release-navigation-polish.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(web): normalize final navigation polish"
            git push origin HEAD:antigravity/web-uniform-gallery-grids-20261023
          fi
