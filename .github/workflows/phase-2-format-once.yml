name: Phase 2 format once

on:
  push:
    branches:
      - phase-2-complete-persisted-admin-writes

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2-complete-persisted-admin-writes

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Phase 2 files
        run: |
          pnpm exec prettier --write \
            apps/admin/app/offerings/page.tsx \
            apps/admin/app/plans/page.tsx \
            apps/admin/app/venues/page.tsx \
            tests/integration/phase-2-admin-academy-writes.test.mjs \
            tests/phase-2-admin-persisted-writes.test.mjs

      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/admin/app/offerings/page.tsx \
            apps/admin/app/plans/page.tsx \
            apps/admin/app/venues/page.tsx \
            tests/integration/phase-2-admin-academy-writes.test.mjs \
            tests/phase-2-admin-persisted-writes.test.mjs
          git commit -m "Format complete Phase 2 implementation"
          git push origin HEAD:phase-2-complete-persisted-admin-writes
