name: Pre-Alpha Admin HTTP Integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  admin-http-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: khlim_admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Admin HTTP integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khlim_admin_test
          KHLIM_TEST_DATABASE: "1"
          SENTRY_DSN: ""
        run: pnpm test:pre-alpha:admin
