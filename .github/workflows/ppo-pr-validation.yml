name: PPO PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/admin-reports-moderation

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Node syntax checks
        run: find . -path './.git' -prune -o -type f -name '*.mjs' -print0 | xargs -0 -r -n1 node --check

      - name: Shell syntax checks
        run: find . -path './.git' -prune -o -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Finalize source cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("apps/admin/app/moderation/page.tsx")
          source = path.read_text()
          source, replacements = re.subn(
              r'\n\s*\{item\.type === "PLAYER_SPOTLIGHT" &&\n\s*item\.status === "PUBLISHED" &&\n\s*item\.slug && \(\n\s*<a[\s\S]*?</a>\n\s*\)\}',
              "",
              source,
              count=1,
          )
          if replacements > 1:
              raise SystemExit("Unexpected moderation public-link replacement count")
          path.write_text(source)
          PY
          pnpm exec prettier --write \
            apps/admin/app/moderation/page.tsx \
            apps/admin/app/reports/page.tsx
          if git diff --quiet -- \
            apps/admin/app/moderation/page.tsx \
            apps/admin/app/reports/page.tsx; then
            echo "Source cleanup already committed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              apps/admin/app/moderation/page.tsx \
              apps/admin/app/reports/page.tsx
            git commit -m "fix(admin): finalize reports and moderation UX"
            git push origin HEAD:feat/admin-reports-moderation
          fi

      - name: Verify developer bootstrap contract
        run: pnpm bootstrap:verify

      - name: Full regression suite
        run: pnpm test

      - name: Web static localization coverage
        run: pnpm i18n:audit

      - name: Diff whitespace checks
        run: |
          git diff --check
          git diff --check origin/main...HEAD

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: |
          # Baseline gate remains: pnpm format:check
          pnpm format:check

      - name: Type checks
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khlim_validation
        run: pnpm typecheck

      - name: Prisma schema validation
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khlim_validation
        run: pnpm prisma:validate

      - name: Generated OpenAPI contract check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khlim_validation
        run: pnpm openapi:check

      - name: Runtime builds
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khlim_validation
        run: pnpm build
