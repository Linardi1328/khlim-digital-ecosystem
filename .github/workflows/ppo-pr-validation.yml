name: PPO PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Node syntax checks
        run: find . -path './.git' -prune -o -type f -name '*.mjs' -print0 | xargs -0 -r -n1 node --check

      - name: Shell syntax checks
        run: find . -path './.git' -prune -o -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Bootstrap workspace dependency lock
        run: pnpm install --no-frozen-lockfile

      - name: Bootstrap generated API contract
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khlim_validation
        run: pnpm openapi:generate

      - name: Upload deterministic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-generated-artifacts
          path: |
            pnpm-lock.yaml
            openapi/khlim-v1.json
            packages/api-client/src/schema.d.ts

      - name: Verify developer bootstrap contract
        run: pnpm bootstrap:verify

      - name: Full regression suite
        run: pnpm test

      - name: Diff whitespace checks
        run: |
          git diff --check
          git diff --check origin/main...HEAD

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Type checks
        run: pnpm typecheck

      - name: Prisma schema validation
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khlim_validation
        run: pnpm prisma:validate

      - name: Runtime builds
        run: pnpm build
