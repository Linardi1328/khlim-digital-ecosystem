name: PPO PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Prettier normalization
        run: pnpm format

      - name: Commit formatting normalization
        run: |
          if git diff --quiet; then
            echo "Formatting already normalized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps packages tests scripts .github package.json eslint.config.mjs .prettierrc.json
            git commit -m "style: normalize Phase 1 formatting"
            git push origin HEAD:${{ github.head_ref }}
          fi
