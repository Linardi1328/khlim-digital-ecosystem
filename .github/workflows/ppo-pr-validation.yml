name: PPO PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Node syntax checks
        run: find . -path './.git' -prune -o -type f -name '*.mjs' -print0 | xargs -0 -r -n1 node --check

      - name: Shell syntax checks
        run: find . -path './.git' -prune -o -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Bootstrap workspace dependency lock
        run: pnpm install --no-frozen-lockfile

      - name: Bootstrap generated API contract
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khlim_validation
        run: pnpm openapi:generate

      - name: Commit generated deterministic artifacts
        run: |
          git add pnpm-lock.yaml openapi/khlim-v1.json packages/api-client/src/schema.d.ts
          if git diff --cached --quiet; then
            echo "Generated artifacts already committed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: commit deterministic Phase 1 artifacts"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Verify developer bootstrap contract
        run: pnpm bootstrap:verify
