name: PPO PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize Phase 2 completion artifacts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khlim_validation
        run: |
          pnpm format
          pnpm openapi:generate
          pnpm format

      - name: Commit normalized Phase 2 completion artifacts
        run: |
          if git diff --quiet; then
            echo "Artifacts already normalized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps tests openapi packages/api-client/src/schema.d.ts prisma/schema.prisma
            git commit -m "chore: normalize Phase 2 completion artifacts"
            git push origin HEAD:${{ github.head_ref }}
          fi
