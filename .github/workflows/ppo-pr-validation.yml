name: PPO PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Node syntax checks
        run: find . -path './.git' -prune -o -type f -name '*.mjs' -print0 | xargs -0 -r -n1 node --check

      - name: Shell syntax checks
        run: find . -path './.git' -prune -o -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Full regression suite
        run: |
          if [[ -f tests/foundation.test.mjs ]]; then
            node --test tests/foundation.test.mjs
          else
            echo "No foundation test exists on this bootstrap baseline."
          fi

      - name: Diff whitespace checks
        run: |
          git diff --check
          git diff --check origin/main...HEAD
