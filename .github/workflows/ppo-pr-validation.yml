name: PPO PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/admin-kpi-observability

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Node syntax checks
        run: find . -path './.git' -prune -o -type f -name '*.mjs' -print0 | xargs -0 -r -n1 node --check

      - name: Shell syntax checks
        run: find . -path './.git' -prune -o -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize feature artifacts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khlim_validation
        run: |
          pnpm exec prettier --write \
            apps/admin/app/insights/page.tsx \
            apps/api/src/admin/admin-access.controller.ts \
            apps/api/src/admin/admin-observability.service.ts \
            tests/admin-kpi-observability.test.mjs \
            tests/e2e/admin-kpi-observability.spec.mjs
          pnpm openapi:generate
          if git diff --quiet -- \
            apps/admin/app/insights/page.tsx \
            apps/api/src/admin/admin-access.controller.ts \
            apps/api/src/admin/admin-observability.service.ts \
            tests/admin-kpi-observability.test.mjs \
            tests/e2e/admin-kpi-observability.spec.mjs \
            openapi/khlim-v1.json \
            packages/api-client/src/schema.d.ts; then
            echo "Feature artifacts already normalized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              apps/admin/app/insights/page.tsx \
              apps/api/src/admin/admin-access.controller.ts \
              apps/api/src/admin/admin-observability.service.ts \
              tests/admin-kpi-observability.test.mjs \
              tests/e2e/admin-kpi-observability.spec.mjs \
              openapi/khlim-v1.json \
              packages/api-client/src/schema.d.ts
            git commit -m "chore(admin): format KPI health and refresh API contract"
            git push origin HEAD:feat/admin-kpi-observability
          fi

      - name: Verify developer bootstrap contract
        run: pnpm bootstrap:verify

      - name: Full regression suite
        run: pnpm test

      - name: Web static localization coverage
        run: pnpm i18n:audit

      - name: Diff whitespace checks
        run: |
          git diff --check
          git diff --check origin/main...HEAD

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Type checks
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khlim_validation
        run: pnpm typecheck

      - name: Prisma schema validation
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khlim_validation
        run: pnpm prisma:validate

      - name: Generated OpenAPI contract check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khlim_validation
        run: pnpm openapi:check

      - name: Runtime builds
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khlim_validation
        run: pnpm build
