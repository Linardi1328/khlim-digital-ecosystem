name: PPO PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Node syntax checks
        run: find . -path './.git' -prune -o -type f -name '*.mjs' -print0 | xargs -0 -r -n1 node --check

      - name: Shell syntax checks
        run: find . -path './.git' -prune -o -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify developer bootstrap contract
        run: pnpm bootstrap:verify

      - name: Full regression suite
        run: pnpm test

      - name: Web static localization coverage
        run: pnpm i18n:audit

      - name: Diff whitespace checks
        run: |
          git diff --check
          git diff --check origin/main...HEAD

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: |
          # Baseline gate remains: pnpm format:check
          pnpm exec prettier --write apps/admin/app/users/page.tsx
          git diff -- apps/admin/app/users/page.tsx
          exit 1

      - name: Type checks
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khlim_validation
        run: pnpm typecheck

      - name: Prisma schema validation
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khlim_validation
        run: pnpm prisma:validate

      - name: Generated OpenAPI contract check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khlim_validation
        run: pnpm openapi:check

      - name: Runtime builds
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khlim_validation
        run: pnpm build
