name: Scoped formatting cleanup (temporary)

on:
  push:
    branches:
      - antigravity/web-uniform-gallery-grids-20261023
    paths:
      - .github/workflows/temporary-khlim-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: antigravity/web-uniform-gallery-grids-20261023
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable workspace formatter
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
      - name: Format only the reviewed changes
        run: |
          pnpm exec prettier --write tests/verified-milestone-gallery.test.mjs tests/staging-media-review.test.mjs tests/web-uniform-gallery-grid.test.mjs tests/e2e/web-preview.spec.mjs apps/web/app/editorial.css
          git diff --check
      - name: Commit formatting-only changes
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -- tests/verified-milestone-gallery.test.mjs tests/staging-media-review.test.mjs tests/web-uniform-gallery-grid.test.mjs tests/e2e/web-preview.spec.mjs apps/web/app/editorial.css
          if ! git diff --cached --quiet; then
            git commit -m "style(web): normalize gallery formatting"
            git push origin HEAD:antigravity/web-uniform-gallery-grids-20261023
          fi
