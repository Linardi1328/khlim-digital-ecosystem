name: Scoped formatting cleanup (temporary)
on:
  push:
    branches:
      - antigravity/admin-nine-section-navigation-20261022
    paths:
      - .github/workflows/temporary-khlim-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: antigravity/admin-nine-section-navigation-20261022
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable workspace formatter
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
      - name: Format only reviewed files
        run: |
          pnpm exec prettier --write apps/admin/app/notifications/page.tsx apps/admin/components/layout/admin-sections.ts apps/admin/components/layout/AdminSectionNavigation.tsx apps/admin/components/layout/AdminSidebar.tsx apps/admin/components/layout/AdminShell.tsx apps/admin/components/layout/AdminHeader.tsx tests/admin-frontend.test.mjs tests/admin-section-navigation.test.mjs tests/e2e/admin-ui.spec.mjs tests/campaign-analytics-admin.test.mjs
          git diff --check
      - name: Commit formatting-only changes
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -- apps/admin/app/notifications/page.tsx apps/admin/components/layout/admin-sections.ts apps/admin/components/layout/AdminSectionNavigation.tsx apps/admin/components/layout/AdminSidebar.tsx apps/admin/components/layout/AdminShell.tsx apps/admin/components/layout/AdminHeader.tsx tests/admin-frontend.test.mjs tests/admin-section-navigation.test.mjs tests/e2e/admin-ui.spec.mjs tests/campaign-analytics-admin.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(admin-nav): normalize release formatting"
            git push origin HEAD:antigravity/admin-nine-section-navigation-20261022
          fi
