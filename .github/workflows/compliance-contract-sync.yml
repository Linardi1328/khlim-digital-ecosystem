name: Compliance contract sync

on:
  push:
    branches:
      - compliance/legal-accessibility-hardening
    paths:
      - .github/workflows/compliance-contract-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: compliance/legal-accessibility-hardening
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Wire versioned guardian consent through enrolment
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/app/enrol/page.tsx")
          text = path.read_text()

          marker = "function isUnder18(dateOfBirth: string | null | undefined): boolean {"
          if 'const PRIVACY_NOTICE_VERSION = "2026-09-11";' not in text:
              if marker not in text:
                  raise SystemExit("isUnder18 marker not found")
              text = text.replace(
                  marker,
                  'const PRIVACY_NOTICE_VERSION = "2026-09-11";\n\n' + marker,
                  1,
              )

          old = '''          const created = await addChild({
            displayName: newChildName.trim(),
            dateOfBirth: newChildDob,
          });'''
          new = '''          const created = await addChild({
            displayName: newChildName.trim(),
            dateOfBirth: newChildDob,
            ...(isUnder18(newChildDob)
              ? {
                  relationshipType: "guardian",
                  guardianDataConsent: true,
                  privacyNoticeVersion: PRIVACY_NOTICE_VERSION,
                }
              : {}),
          });'''
          if old not in text and "privacyNoticeVersion: PRIVACY_NOTICE_VERSION" not in text:
              raise SystemExit("addChild payload marker not found")
          if old in text:
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Format source changes
        run: pnpm exec prettier --write apps/web/app/enrol/page.tsx apps/api/src/family/family.dto.ts apps/api/src/family/family.service.ts tests/phase-5-editorial-highlights.test.mjs tests/phase-5-frontend.test.mjs apps/web/lib/editorial-api.ts
      - name: Regenerate OpenAPI contract and client types
        run: pnpm openapi:generate
      - name: Remove temporary sync workflow
        run: rm .github/workflows/compliance-contract-sync.yml
      - name: Commit generated contract and enrolment wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Sync guardian consent contract and generated client"
          git push origin HEAD:compliance/legal-accessibility-hardening
