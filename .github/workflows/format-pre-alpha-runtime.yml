name: Format Pre-Alpha Runtime Test

on:
  push:
    branches:
      - test/pre-alpha-runtime-boundaries

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/pre-alpha-runtime-boundaries

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Format runtime test
        run: pnpm exec prettier --write tests/integration/pre-alpha-runtime-boundaries.test.mjs

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/pre-alpha-runtime-boundaries.test.mjs
          git commit -m "style(test): format pre-alpha runtime suite"
          git push origin HEAD:test/pre-alpha-runtime-boundaries
