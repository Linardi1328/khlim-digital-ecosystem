              s = s.replace('{ href: "/scheduling", label: "Scheduling", icon: "📅" },', '{ href: "/scheduling", label: "Scheduling", icon: "📅" },\n  { href: "/editorial", label: "Editorial Studio", icon: "📰" },')
          sidebar.write_text(s)

          admin_page = Path('apps/admin/app/editorial/page.tsx')
          admin_page.parent.mkdir(exist_ok=True)
          admin_page.write_text(r'''"use client";

import React, { useEffect, useState } from "react";
import { AdminShell } from "../../components/layout/AdminShell";
import { PageHeader } from "../../components/ui/PageHeader";
import { Button } from "../../components/ui/Button";
import { getAdminAccessToken } from "../../lib/admin-api";

const API = (process.env.NEXT_PUBLIC_API_BASE_URL || "http://localhost:3001/v1").replace(/\/+$/, "");

type Entry = { id: string; type: "ACHIEVEMENT" | "PLAYER_SPOTLIGHT"; slug?: string | null; title: string; eventName: string; summary: string; yearLabel?: string | null; playerName?: string | null; achievement?: string | null; achievedOnLabel?: string | null; articleParagraphs?: string[] | null; photoLabel: string; imageUrl?: string | null; factsVerified: boolean; aiAssisted: boolean; status: "DRAFT" | "PUBLISHED" | "ARCHIVED" };

const empty = { type: "PLAYER_SPOTLIGHT" as const, slug: "", title: "", eventName: "", summary: "", yearLabel: "", playerName: "", achievement: "", achievedOnLabel: "", articleParagraphs: "", photoLabel: "", imageUrl: "", factsVerified: false, developmentNote: "" };

async function api(path: string, init?: RequestInit) {
  const token = getAdminAccessToken();
  const response = await fetch(`${API}${path}`, { ...init, headers: { "Content-Type": "application/json", ...(token ? { Authorization: `Bearer ${token}` } : {}), ...(init?.headers || {}) } });
  if (!response.ok) throw new Error((await response.text()) || `HTTP ${response.status}`);
  return response.json();
}

export default function EditorialStudioPage() {
  const [entries, setEntries] = useState<Entry[]>([]);
  const [form, setForm] = useState({ ...empty });
  const [message, setMessage] = useState("");
  const load = () => api("/admin/editorial").then(setEntries).catch((error) => setMessage(error.message));
  useEffect(() => { void load(); }, []);

  const set = (key: string, value: string | boolean) => setForm((current) => ({ ...current, [key]: value }));

  async function generateDraft() {
    try {
      const draft = await api("/admin/editorial/player-spotlights/draft", { method: "POST", body: JSON.stringify({ playerName: form.playerName, eventName: form.eventName, achievement: form.achievement, achievedOnLabel: form.achievedOnLabel, developmentNote: form.developmentNote }) });
      setForm((current) => ({ ...current, title: draft.headline, summary: draft.excerpt, articleParagraphs: draft.articleParagraphs.join("\n\n") }));
      setMessage("AI-assisted draft generated from the supplied facts. Review it before saving.");
    } catch (error) { setMessage(error instanceof Error ? error.message : String(error)); }
  }

  async function save() {
    try {
      const payload = { ...form, articleParagraphs: form.type === "PLAYER_SPOTLIGHT" ? form.articleParagraphs.split(/\n\s*\n/).filter(Boolean) : undefined, aiAssisted: form.type === "PLAYER_SPOTLIGHT" };
      delete (payload as { developmentNote?: string }).developmentNote;
      await api("/admin/editorial", { method: "POST", body: JSON.stringify(payload) });
      setForm({ ...empty, type: form.type });
      setMessage("Draft saved.");
      await load();
    } catch (error) { setMessage(error instanceof Error ? error.message : String(error)); }
  }

  async function transition(id: string, action: "publish" | "unpublish") {
    try { await api(`/admin/editorial/${id}/${action}`, { method: "POST" }); setMessage(action === "publish" ? "Published to the public website." : "Removed from the public website."); await load(); }
    catch (error) { setMessage(error instanceof Error ? error.message : String(error)); }
  }

  return <AdminShell><div><PageHeader title="Editorial Studio" subtitle="Create verified club achievements and Player Spotlight newsletters, with AI-assisted drafting from staff-supplied facts." breadcrumbs={[{ label: "Operations", href: "/" }, { label: "Editorial Studio" }]} />
    <div style={{ display: "grid", gridTemplateColumns: "minmax(0, 1.1fr) minmax(320px, .9fr)", gap: 24 }}>
      <section style={{ background: "white", border: "1px solid #E2E8F0", borderRadius: 12, padding: 20 }}>
        <h2 style={{ marginTop: 0 }}>New editorial draft</h2>
        <label>Content type<select value={form.type} onChange={(e) => set("type", e.target.value)} style={{ width: "100%", padding: 10, margin: "6px 0 14px" }}><option value="PLAYER_SPOTLIGHT">Player Spotlight</option><option value="ACHIEVEMENT">Club Achievement</option></select></label>
        {form.type === "PLAYER_SPOTLIGHT" ? <>
          <label>Player name<input value={form.playerName} onChange={(e) => set("playerName", e.target.value)} /></label>
          <label>URL slug<input value={form.slug} onChange={(e) => set("slug", e.target.value)} placeholder="player-name-event" /></label>
          <label>Achievement<input value={form.achievement} onChange={(e) => set("achievement", e.target.value)} placeholder="Gold medal / selection / milestone" /></label>
          <label>Achievement date<input value={form.achievedOnLabel} onChange={(e) => set("achievedOnLabel", e.target.value)} /></label>
          <label>Development note<textarea value={form.developmentNote} onChange={(e) => set("developmentNote", e.target.value)} /></label>
        </> : <label>Year / season label<input value={form.yearLabel} onChange={(e) => set("yearLabel", e.target.value)} /></label>}
        <label>Event name<input value={form.eventName} onChange={(e) => set("eventName", e.target.value)} /></label>
        {form.type === "PLAYER_SPOTLIGHT" && <Button variant="outline" onClick={generateDraft}>Generate AI-assisted draft</Button>}
        <label>Headline / title<input value={form.title} onChange={(e) => set("title", e.target.value)} /></label>
        <label>Summary<textarea value={form.summary} onChange={(e) => set("summary", e.target.value)} /></label>
        {form.type === "PLAYER_SPOTLIGHT" && <label>Article paragraphs<textarea value={form.articleParagraphs} onChange={(e) => set("articleParagraphs", e.target.value)} rows={10} /></label>}
        <label>Photo description<input value={form.photoLabel} onChange={(e) => set("photoLabel", e.target.value)} /></label>
        <label>Approved photo URL (optional)<input value={form.imageUrl} onChange={(e) => set("imageUrl", e.target.value)} /></label>
        <label style={{ display: "flex", gap: 8, alignItems: "center", margin: "12px 0" }}><input type="checkbox" checked={form.factsVerified} onChange={(e) => set("factsVerified", e.target.checked)} /> Facts and photo rights verified by KHLIM staff</label>
        <Button onClick={save}>Save draft</Button>
        {message && <p role="status" style={{ marginBottom: 0 }}>{message}</p>}
      </section>
      <section><h2 style={{ marginTop: 0 }}>Saved content</h2>{entries.length === 0 && <p>No editorial entries yet.</p>}{entries.map((entry) => <article key={entry.id} style={{ background: "white", border: "1px solid #E2E8F0", borderRadius: 12, padding: 16, marginBottom: 12 }}><div style={{ display: "flex", justifyContent: "space-between", gap: 12 }}><strong>{entry.title}</strong><span>{entry.status}</span></div><p>{entry.eventName} · {entry.factsVerified ? "Facts verified" : "Verification required"}</p><div style={{ display: "flex", gap: 8 }}>{entry.status === "PUBLISHED" ? <Button variant="outline" size="sm" onClick={() => transition(entry.id, "unpublish")}>Unpublish</Button> : <Button size="sm" disabled={!entry.factsVerified} onClick={() => transition(entry.id, "publish")}>Publish</Button>}{entry.type === "PLAYER_SPOTLIGHT" && entry.slug && <a href={`/spotlight/${entry.slug}`} target="_blank" rel="noreferrer">Preview public URL</a>}</div></article>)}</section>
    </div>
    <style jsx>{`label{display:block;font-size:.85rem;font-weight:650;color:#334155;margin-top:12px}input,textarea,select{box-sizing:border-box;width:100%;margin-top:6px;padding:10px;border:1px solid #CBD5E1;border-radius:8px;font:inherit}textarea{resize:vertical}`}</style>
  </div></AdminShell>;
}
''')

          # Public API helper and client-backed homepage sections.
          Path('apps/web/lib/editorial-api.ts').write_text(r'''import type { AchievementStory, PlayerSpotlightArticle } from "./editorial-content";
const API = (process.env.NEXT_PUBLIC_API_BASE_URL || "http://localhost:3001/v1").replace(/\/+$/, "");
const GRADIENT = "linear-gradient(135deg, #18181b, #3f2d0b 58%, #0f172a)";

type Entry = { id:string; slug?:string|null; title:string; eventName:string; summary:string; yearLabel?:string|null; playerName?:string|null; achievement?:string|null; achievedOnLabel?:string|null; articleParagraphs?:unknown; photoLabel:string; imageUrl?:string|null; factsVerified:boolean; status:string; aiAssisted:boolean };
function paragraphs(value: unknown): string[] { return Array.isArray(value) ? value.filter((item): item is string => typeof item === "string") : []; }
export function toAchievement(entry: Entry): AchievementStory { return { id:entry.id, yearLabel:entry.yearLabel || "KHLIM", title:entry.title, eventName:entry.eventName, description:entry.summary, photoLabel:entry.photoLabel, imageUrl:entry.imageUrl || undefined, placeholderGradient:GRADIENT, factsVerified:entry.factsVerified, status:"published" }; }
export function toSpotlight(entry: Entry): PlayerSpotlightArticle { return { slug:entry.slug || entry.id, playerName:entry.playerName || "KHLIM Player", headline:entry.title, eventName:entry.eventName, achievement:entry.achievement || "Verified milestone", achievedOnLabel:entry.achievedOnLabel || "Verified event date", excerpt:entry.summary, articleParagraphs:paragraphs(entry.articleParagraphs), photoLabel:entry.photoLabel, imageUrl:entry.imageUrl || undefined, placeholderGradient:GRADIENT, factsVerified:entry.factsVerified, status:"published", aiAssisted:true }; }
async function get(path:string) { const response = await fetch(`${API}${path}`, { cache:"no-store" }); if (!response.ok) throw new Error(`Editorial API ${response.status}`); return response.json() as Promise<Entry[]>; }
export async function fetchPublishedAchievements(){ return (await get("/editorial/achievements")).map(toAchievement); }
export async function fetchPublishedSpotlights(){ return (await get("/editorial/player-spotlights")).map(toSpotlight); }
export async function fetchPublishedSpotlight(slug:string){ const response = await fetch(`${API}/editorial/player-spotlights/${encodeURIComponent(slug)}`, { cache:"no-store" }); if (!response.ok) return null; const entry = await response.json() as Entry | null; return entry ? toSpotlight(entry) : null; }
''')

