test("public website consumes only published verified editorial API data", async () => { const controller=await read("apps/api/src/editorial/editorial.controller.ts"); const helper=await read("apps/web/lib/editorial-api.ts"); assert.match(controller,/editorial\/achievements/); assert.match(controller,/editorial\/player-spotlights/); assert.match(helper,/cache:"no-store"/); });
test("Admin navigation exposes Editorial Studio", async () => { const nav=await read("apps/admin/components/layout/AdminSidebar.tsx"); assert.match(nav,/\/editorial/); assert.match(nav,/Editorial Studio/); });
