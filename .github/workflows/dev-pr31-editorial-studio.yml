name: Dev PR31 Editorial Studio

on:
  push:
    branches:
      - feat/admin-editorial-studio

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: khlim
          POSTGRES_PASSWORD: khlim
          POSTGRES_DB: khlim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khlim -d khlim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://khlim:khlim@127.0.0.1:5432/khlim_test
      DIRECT_URL: postgresql://khlim:khlim@127.0.0.1:5432/khlim_test
      KHLIM_TEST_DATABASE: "1"
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001/v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-editorial-studio
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Implement editorial persistence, API, Admin studio and public consumption
        run: |
          python <<'PY'
          from pathlib import Path

          schema = Path('prisma/schema.prisma')
          text = schema.read_text()
          if 'enum EditorialEntryType' not in text:
              text += '''\n\nenum EditorialEntryType {\n  ACHIEVEMENT\n  PLAYER_SPOTLIGHT\n}\n\nenum EditorialEntryStatus {\n  DRAFT\n  PUBLISHED\n  ARCHIVED\n}\n\nmodel EditorialEntry {\n  id                String               @id @default(uuid()) @db.Uuid\n  type              EditorialEntryType\n  slug              String?              @unique @db.VarChar(160)\n  title             String               @db.VarChar(220)\n  eventName         String               @db.VarChar(220)\n  summary           String               @db.Text\n  yearLabel         String?              @db.VarChar(80)\n  playerName        String?              @db.VarChar(160)\n  achievement       String?              @db.VarChar(220)\n  achievedOnLabel   String?              @db.VarChar(120)\n  articleParagraphs Json?\n  photoLabel        String               @db.VarChar(220)\n  imageUrl          String?              @db.Text\n  factsVerified     Boolean              @default(false)\n  aiAssisted        Boolean              @default(false)\n  status            EditorialEntryStatus @default(DRAFT)\n  publishedAt       DateTime?\n  createdAt         DateTime             @default(now())\n  updatedAt         DateTime             @updatedAt\n\n  @@index([type, status, publishedAt])\n  @@map("editorial_entries")\n}\n'''
          schema.write_text(text)

          migration = Path('prisma/migrations/20260828024500_editorial_studio')
          migration.mkdir(exist_ok=True)
          (migration / 'migration.sql').write_text('''CREATE TYPE "EditorialEntryType" AS ENUM ('ACHIEVEMENT', 'PLAYER_SPOTLIGHT');\nCREATE TYPE "EditorialEntryStatus" AS ENUM ('DRAFT', 'PUBLISHED', 'ARCHIVED');\n\nCREATE TABLE "editorial_entries" (\n  "id" UUID NOT NULL,\n  "type" "EditorialEntryType" NOT NULL,\n  "slug" VARCHAR(160),\n  "title" VARCHAR(220) NOT NULL,\n  "eventName" VARCHAR(220) NOT NULL,\n  "summary" TEXT NOT NULL,\n  "yearLabel" VARCHAR(80),\n  "playerName" VARCHAR(160),\n  "achievement" VARCHAR(220),\n  "achievedOnLabel" VARCHAR(120),\n  "articleParagraphs" JSONB,\n  "photoLabel" VARCHAR(220) NOT NULL,\n  "imageUrl" TEXT,\n  "factsVerified" BOOLEAN NOT NULL DEFAULT false,\n  "aiAssisted" BOOLEAN NOT NULL DEFAULT false,\n  "status" "EditorialEntryStatus" NOT NULL DEFAULT 'DRAFT',\n  "publishedAt" TIMESTAMP(3),\n  "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  "updatedAt" TIMESTAMP(3) NOT NULL,\n  CONSTRAINT "editorial_entries_pkey" PRIMARY KEY ("id")\n);\nCREATE UNIQUE INDEX "editorial_entries_slug_key" ON "editorial_entries"("slug");\nCREATE INDEX "editorial_entries_type_status_publishedAt_idx" ON "editorial_entries"("type", "status", "publishedAt");\n''')

          editorial_dir = Path('apps/api/src/editorial')
          editorial_dir.mkdir(exist_ok=True)
          (editorial_dir / 'editorial.service.ts').write_text(r'''import { BadRequestException, Injectable, NotFoundException } from "@nestjs/common";
import { PrismaService } from "../database/prisma.service";

export type EditorialType = "ACHIEVEMENT" | "PLAYER_SPOTLIGHT";

interface EditorialInput {
  type: EditorialType;
  slug?: string;
  title: string;
  eventName: string;
  summary: string;
  yearLabel?: string;
  playerName?: string;
  achievement?: string;
  achievedOnLabel?: string;
  articleParagraphs?: string[];
  photoLabel: string;
  imageUrl?: string;
  factsVerified?: boolean;
  aiAssisted?: boolean;
}

@Injectable()
export class EditorialService {
  constructor(private readonly prisma: PrismaService) {}

  listAdmin() {
    return this.prisma.client.editorialEntry.findMany({ orderBy: { updatedAt: "desc" } });
  }

  listPublished(type: EditorialType) {
    return this.prisma.client.editorialEntry.findMany({
      where: { type, status: "PUBLISHED", factsVerified: true },
      orderBy: [{ publishedAt: "desc" }, { createdAt: "desc" }],
    });
  }

  async findPublishedSpotlight(slug: string) {
    return this.prisma.client.editorialEntry.findFirst({
      where: { slug, type: "PLAYER_SPOTLIGHT", status: "PUBLISHED", factsVerified: true },
    });
  }

  create(input: EditorialInput) {
    this.assertComplete(input);
    return this.prisma.client.editorialEntry.create({
      data: {
        ...input,
        articleParagraphs: input.articleParagraphs ?? undefined,
        factsVerified: Boolean(input.factsVerified),
        aiAssisted: Boolean(input.aiAssisted),
      },
    });
  }

  async update(id: string, input: Partial<EditorialInput>) {
    const existing = await this.requireEntry(id);
    const merged = { ...existing, ...input, articleParagraphs: input.articleParagraphs ?? existing.articleParagraphs } as EditorialInput;
    this.assertComplete(merged);
    return this.prisma.client.editorialEntry.update({
      where: { id },
      data: {
        slug: input.slug,
        title: input.title,
        eventName: input.eventName,
        summary: input.summary,
        yearLabel: input.yearLabel,
        playerName: input.playerName,
        achievement: input.achievement,
        achievedOnLabel: input.achievedOnLabel,
        articleParagraphs: input.articleParagraphs,
        photoLabel: input.photoLabel,
        imageUrl: input.imageUrl,
        factsVerified: input.factsVerified,
        aiAssisted: input.aiAssisted,
      },
    });
  }

  async publish(id: string) {
    const entry = await this.requireEntry(id);
    if (!entry.factsVerified) {
      throw new BadRequestException("Facts must be verified before publication");
    }
    this.assertComplete(entry as EditorialInput);
    return this.prisma.client.editorialEntry.update({
      where: { id },
      data: { status: "PUBLISHED", publishedAt: entry.publishedAt ?? new Date() },
    });
  }

  async unpublish(id: string) {
    await this.requireEntry(id);
    return this.prisma.client.editorialEntry.update({
      where: { id },
      data: { status: "DRAFT", publishedAt: null },
    });
  }

  generateSpotlightDraft(input: {
    playerName: string;
    eventName: string;
    achievement: string;
    achievedOnLabel: string;
    developmentNote?: string;
  }) {
    for (const [key, value] of Object.entries(input).slice(0, 4)) {
      if (!value?.trim()) throw new BadRequestException(`${key} is required`);
    }
    const development = input.developmentNote?.trim() || "the preparation, habits and resilience built through consistent training";
    return {
      headline: `${input.playerName} reaches ${input.achievement} at ${input.eventName}`,
      excerpt: `${input.playerName} has reached ${input.achievement} at ${input.eventName}, a milestone that reflects ${development}.`,
      articleParagraphs: [
        `${input.playerName} reached ${input.achievement} at ${input.eventName} on ${input.achievedOnLabel}, marking a memorable competitive milestone.`,
        `The result reflects ${development}. KHLIM's editorial focus is on the verified achievement and the development habits behind it rather than overstating the club's role.`,
        `The achievement also recognises the wider support around the player, including teammates, coaches and family, while keeping the focus on the athlete's next stage of growth.`,
      ],
      aiAssisted: true,
      generator: "khlim-editorial-assist-v1",
      sourceFactsOnly: true,
    };
  }

  private async requireEntry(id: string) {
    const entry = await this.prisma.client.editorialEntry.findUnique({ where: { id } });
    if (!entry) throw new NotFoundException("Editorial entry not found");
    return entry;
  }

  private assertComplete(input: EditorialInput) {
    if (!input.title?.trim() || !input.eventName?.trim() || !input.summary?.trim() || !input.photoLabel?.trim()) {
      throw new BadRequestException("Title, event name, summary and photo label are required");
    }
    if (input.type === "ACHIEVEMENT" && !input.yearLabel?.trim()) {
      throw new BadRequestException("Achievement year label is required");
    }
    if (input.type === "PLAYER_SPOTLIGHT") {
      if (!input.slug?.trim() || !input.playerName?.trim() || !input.achievement?.trim() || !input.achievedOnLabel?.trim()) {
        throw new BadRequestException("Spotlight slug, player, achievement and event date are required");
      }
      if (!input.articleParagraphs || input.articleParagraphs.length < 2) {
        throw new BadRequestException("Spotlight article requires at least two paragraphs");
      }
    }
  }
}
''')
          (editorial_dir / 'editorial.controller.ts').write_text(r'''import { Body, Controller, Get, Param, Patch, Post } from "@nestjs/common";
import { ApiBearerAuth, ApiOperation, ApiTags } from "@nestjs/swagger";
import { Public, RequireAnyRole, RequireMfa } from "../auth/authorization.decorators";
import { EditorialService } from "./editorial.service";

@ApiTags("editorial")
@Controller()
export class EditorialController {
  constructor(private readonly editorial: EditorialService) {}

  @Public()
  @Get("editorial/achievements")
  listAchievements() { return this.editorial.listPublished("ACHIEVEMENT"); }

  @Public()
  @Get("editorial/player-spotlights")
  listSpotlights() { return this.editorial.listPublished("PLAYER_SPOTLIGHT"); }

  @Public()
  @Get("editorial/player-spotlights/:slug")
  getSpotlight(@Param("slug") slug: string) { return this.editorial.findPublishedSpotlight(slug); }

  @Get("admin/editorial")
  @ApiBearerAuth("supabase")
  @RequireAnyRole("SUPER_ADMIN", "MANAGEMENT", "ACADEMY_ADMIN")
  listAdmin() { return this.editorial.listAdmin(); }

  @Post("admin/editorial")
  @ApiBearerAuth("supabase")
  @RequireAnyRole("SUPER_ADMIN", "MANAGEMENT", "ACADEMY_ADMIN")
  create(@Body() input: Parameters<EditorialService["create"]>[0]) { return this.editorial.create(input); }

  @Patch("admin/editorial/:id")
  @ApiBearerAuth("supabase")
  @RequireAnyRole("SUPER_ADMIN", "MANAGEMENT", "ACADEMY_ADMIN")
  update(@Param("id") id: string, @Body() input: Parameters<EditorialService["update"]>[1]) { return this.editorial.update(id, input); }

  @Post("admin/editorial/player-spotlights/draft")
  @ApiBearerAuth("supabase")
  @RequireAnyRole("SUPER_ADMIN", "MANAGEMENT", "ACADEMY_ADMIN")
  @ApiOperation({ summary: "Generate an AI-assisted newsletter draft from staff-supplied facts" })
  draft(@Body() input: Parameters<EditorialService["generateSpotlightDraft"]>[0]) { return this.editorial.generateSpotlightDraft(input); }

  @Post("admin/editorial/:id/publish")
  @ApiBearerAuth("supabase")
  @RequireAnyRole("SUPER_ADMIN", "MANAGEMENT", "ACADEMY_ADMIN")
  @RequireMfa()
  publish(@Param("id") id: string) { return this.editorial.publish(id); }

  @Post("admin/editorial/:id/unpublish")
  @ApiBearerAuth("supabase")
  @RequireAnyRole("SUPER_ADMIN", "MANAGEMENT", "ACADEMY_ADMIN")
  @RequireMfa()
  unpublish(@Param("id") id: string) { return this.editorial.unpublish(id); }
}
''')
          (editorial_dir / 'editorial.module.ts').write_text(r'''import { Module } from "@nestjs/common";
import { EditorialController } from "./editorial.controller";
import { EditorialService } from "./editorial.service";

@Module({ controllers: [EditorialController], providers: [EditorialService], exports: [EditorialService] })
export class EditorialModule {}
''')

          app = Path('apps/api/src/app.module.ts')
          s = app.read_text()
          if 'EditorialModule' not in s:
              s = s.replace('import { HealthController } from "./health.controller";', 'import { HealthController } from "./health.controller";\nimport { EditorialModule } from "./editorial/editorial.module";')
