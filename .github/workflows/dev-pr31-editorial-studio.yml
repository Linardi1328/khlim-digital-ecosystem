          s = s.replace('export function PlayerSpotlightSection() {\n  const preview = publishedPlayerSpotlights.length === 0;\n  const stories = preview\n    ? [playerSpotlightEditorialPreview]\n    : publishedPlayerSpotlights.slice(0, 3);', 'export function PlayerSpotlightSection() {\n  const [remote, setRemote] = useState<PlayerSpotlightArticle[]>([]);\n  useEffect(() => { fetchPublishedSpotlights().then(setRemote).catch(() => undefined); }, []);\n  const live = remote.length > 0 ? remote : publishedPlayerSpotlights;\n  const preview = live.length === 0;\n  const stories = preview ? [playerSpotlightEditorialPreview] : live.slice(0, 3);')
          s = s.replace('!preview && publishedPlayerSpotlights.length > 3', '!preview && live.length > 3')
          spot.write_text(s)

          # Root regressions.
          Path('tests/phase-6-editorial-studio.test.mjs').write_text(r'''import assert from "node:assert/strict";
