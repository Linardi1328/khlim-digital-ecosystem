name: Phase 5 formatting artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-snapshot:
    if: github.head_ref == 'feat/phase-5-website-parent-portal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Format repository sources
        run: pnpm format

      - name: Package formatted source snapshot
        run: |
          mkdir -p /tmp/phase5-format
          git diff --name-only --diff-filter=ACMRT > /tmp/phase5-format/files.txt
          tar -czf /tmp/phase5-format/formatted-files.tar.gz --files-from=/tmp/phase5-format/files.txt
          git diff > /tmp/phase5-format/prettier.patch

      - uses: actions/upload-artifact@v4
        with:
          name: phase5-prettier-output
          path: /tmp/phase5-format/
          if-no-files-found: error
