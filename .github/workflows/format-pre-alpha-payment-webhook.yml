name: Format Pre-Alpha Payment Webhook Test

on:
  push:
    branches:
      - test/pre-alpha-payment-webhook-integration

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/pre-alpha-payment-webhook-integration

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Format payment webhook integration changes
        run: >-
          pnpm exec prettier --write
          apps/api/src/billing/billing.service.ts
          tests/integration/pre-alpha-payment-webhook-integration.test.mjs

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/billing/billing.service.ts tests/integration/pre-alpha-payment-webhook-integration.test.mjs
          git commit -m "style: format payment webhook integration changes"
          git push origin HEAD:test/pre-alpha-payment-webhook-integration
