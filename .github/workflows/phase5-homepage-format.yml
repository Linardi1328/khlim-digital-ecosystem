name: Phase 5 homepage formatting helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-homepage:
    if: github.head_ref == 'feat/phase-5-homepage-gallery-carousel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Format homepage refinement
        run: >-
          pnpm exec prettier --write
          apps/web/app/page.tsx
          apps/web/components/home/hero-carousel.tsx
          apps/web/components/home/photo-gallery.tsx
          tests/phase-5-homepage-gallery.test.mjs

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/app/page.tsx \
            apps/web/components/home/hero-carousel.tsx \
            apps/web/components/home/photo-gallery.tsx \
            tests/phase-5-homepage-gallery.test.mjs
          git commit -m "style(web): format homepage gallery refinement"
          git push origin HEAD:${{ github.head_ref }}
