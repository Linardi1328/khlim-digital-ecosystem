name: Temporary walkthrough formatter

on:
  push:
    branches:
      - walkthrough-deployment-readiness

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: walkthrough-deployment-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Format walkthrough QA tests
        run: pnpm exec prettier --write tests/e2e/admin-walkthrough-visual.spec.mjs tests/e2e/walkthrough-visual.spec.mjs
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/admin-walkthrough-visual.spec.mjs tests/e2e/walkthrough-visual.spec.mjs
          git commit -m "Format walkthrough visual QA tests"
          git push origin HEAD:walkthrough-deployment-readiness
