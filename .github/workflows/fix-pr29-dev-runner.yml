name: Fix PR29 Dev Runner

on:
  push:
    branches:
      - feat/payment-state-machine-hardening

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payment-state-machine-hardening
      - name: Repair and retrigger verified patch runner
        run: |
          sed -i 's/pnpm prisma:migrate:deploy/pnpm exec prisma migrate deploy/' .github/workflows/dev-pr29-payment-hardening.yml
          sed -i "/if: github.actor != 'github-actions\\[bot\\]'/d" .github/workflows/dev-pr29-payment-hardening.yml
          rm .github/workflows/fix-pr29-dev-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: fix PR29 verified development runner"
          git push origin HEAD:feat/payment-state-machine-hardening
