name: Phase 1B finance follow-up

on:
  push:
    branches:
      - phase-1b-academy-tenant-ownership

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1b-academy-tenant-ownership
          fetch-depth: 0

      - name: Apply finance hardening patch
        run: python scripts/phase-1b-finance-followup.py

      - name: Commit finance hardening patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/billing/billing.service.ts apps/api/src/billing/payment-gateway.ts apps/api/src/billing/billplz-payment-gateway.ts tests/integration/pre-alpha-billplz-sandbox.test.mjs tests/organization-phase-1b.test.mjs
          if git diff --cached --quiet; then
            echo "No finance hardening changes required."
            exit 0
          fi
          git commit -m "Harden Phase 1B finance tenant boundaries"
          git push origin HEAD:phase-1b-academy-tenant-ownership
