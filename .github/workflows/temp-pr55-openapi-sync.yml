name: Temporary PR55 OpenAPI sync

on:
  push:
    branches:
      - milestone-real-admin-multirole

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-real-admin-multirole
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate committed API contract
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khlim_validation
        run: pnpm openapi:generate
      - name: Remove temporary sync workflow
        run: rm .github/workflows/temp-pr55-openapi-sync.yml
      - name: Commit generated contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi/khlim-v1.json packages/api-client/src/schema.d.ts .github/workflows/temp-pr55-openapi-sync.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync PR55 generated API contract"
          git push origin HEAD:milestone-real-admin-multirole
