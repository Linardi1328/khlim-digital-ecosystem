name: Dev PR34 Exact Format

on:
  push:
    branches:
      - feature/ai-platform-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-platform-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format AI foundation
        run: pnpm exec prettier --write apps/api/src/ai/ai.service.ts apps/api/src/ai/ai.types.ts
      - name: Remove helper and push exact formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/dev-pr34-format.yml
          git add apps/api/src/ai/ai.service.ts apps/api/src/ai/ai.types.ts .github/workflows/dev-pr34-format.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(ai): apply exact Prettier formatting"
          git push origin HEAD:feature/ai-platform-foundation
