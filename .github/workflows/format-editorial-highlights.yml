name: Format Editorial Highlights

on:
  push:
    branches:
      - feat/home-achievements-player-spotlight

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-achievements-player-spotlight

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Format editorial feature files
        run: >-
          pnpm exec prettier --write
          apps/web/app/spotlight/[slug]/page.tsx
          apps/web/components/home/achievements-section.tsx
          apps/web/components/home/player-spotlight-section.tsx
          apps/web/lib/editorial-content.ts
          tests/e2e/web-preview.spec.mjs

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/spotlight/[slug]/page.tsx apps/web/components/home/achievements-section.tsx apps/web/components/home/player-spotlight-section.tsx apps/web/lib/editorial-content.ts tests/e2e/web-preview.spec.mjs
          git commit -m "style: format editorial highlights changes"
          git push origin HEAD:feat/home-achievements-player-spotlight
