name: Admin UI E2E

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  playwright-demo:
    name: Admin UI E2E (Demo Mode + Isolation)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_ADMIN_DEMO_MODE: "true"
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001/v1
      PLAYWRIGHT_ADMIN_BASE_URL: http://127.0.0.1:3002
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build demo admin exact commit
        env:
          VERCEL: "1"
        run: pnpm --filter @khlim/admin build

      - name: Start demo admin server
        run: |
          pnpm --filter @khlim/admin start > /tmp/khlim-admin-demo.log 2>&1 &
          echo $! > /tmp/khlim-admin-demo.pid

      - name: Wait for demo admin server
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent "$PLAYWRIGHT_ADMIN_BASE_URL/" --output /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/khlim-admin-demo.log
          exit 1

      - name: Run demo admin browser tests and demo-isolation proof
        run: |
          pnpm exec playwright test --config=playwright.admin.config.mjs \
            tests/e2e/admin-ui.spec.mjs \
            tests/e2e/admin-kpi-observability.spec.mjs \
            tests/e2e/admin-governance.spec.mjs \
            tests/e2e/admin-walkthrough-visual.spec.mjs \
            tests/e2e/ric-191-admin-demo-isolation.spec.mjs

      - name: Upload demo admin browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-e2e-demo-artifacts
          path: |
            playwright-admin-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  playwright-authenticated:
    name: Admin UI E2E (Authenticated Registration Console)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_ADMIN_DEMO_MODE: "false"
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001/v1
      PLAYWRIGHT_ADMIN_BASE_URL: http://127.0.0.1:3002
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build authenticated admin exact commit
        env:
          VERCEL: "1"
        run: pnpm --filter @khlim/admin build

      - name: Start authenticated admin server
        run: |
          pnpm --filter @khlim/admin start > /tmp/khlim-admin-auth.log 2>&1 &
          echo $! > /tmp/khlim-admin-auth.pid

      - name: Wait for authenticated admin server
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent "$PLAYWRIGHT_ADMIN_BASE_URL/" --output /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/khlim-admin-auth.log
          exit 1

      - name: Run authenticated admin registration browser tests
        run: |
          pnpm exec playwright test --config=playwright.admin.config.mjs \
            tests/e2e/ric-191-admin-registrations.spec.mjs

      - name: Upload authenticated admin browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-e2e-authenticated-artifacts
          path: |
            playwright-admin-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
