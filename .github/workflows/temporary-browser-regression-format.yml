name: Final browser regression formatter (temporary)
on:
  push:
    branches:
      - antigravity/web-uniform-gallery-grids-20261023
    paths:
      - .github/workflows/temporary-browser-regression-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: antigravity/web-uniform-gallery-grids-20261023
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Normalize Playwright regression with repository formatter
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write tests/e2e/web-preview.spec.mjs
          git diff --check
      - name: Commit formatting-only change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/e2e/web-preview.spec.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(test): format public navigation browser assertions"
            git push origin HEAD:antigravity/web-uniform-gallery-grids-20261023
          fi
