name: PR35 Exact Formatter

on:
  push:
    branches:
      - fix/web-i18n-logo-acceptance

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/web-i18n-logo-acceptance

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply pinned repository formatter
        run: pnpm exec prettier --write "apps/**/*.{ts,tsx,json}" "packages/**/*.{ts,mjs,json}" "tests/**/*.mjs" "scripts/**/*.mjs" "*.{json,mjs}" ".github/workflows/*.yml"

      - name: Remove one-shot helper and commit exact output
        run: |
          rm .github/workflows/pr35-exact-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(web): apply repository formatter"
          git push origin HEAD:fix/web-i18n-logo-acceptance
