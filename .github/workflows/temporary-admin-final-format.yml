name: Final Admin formatting cleanup (temporary)
on:
  push:
    branches:
      - antigravity/admin-integrated-ux-rosters-20261023
    paths:
      - .github/workflows/temporary-admin-final-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: antigravity/admin-integrated-ux-rosters-20261023
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run project formatter
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write apps/admin/app/offerings/page.tsx apps/admin/lib/admin-academy-roster-api.ts
          git diff --check
      - name: Commit source formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/admin/app/offerings/page.tsx apps/admin/lib/admin-academy-roster-api.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(admin): format offering roster fallback"
            git push origin HEAD:antigravity/admin-integrated-ux-rosters-20261023
          fi
