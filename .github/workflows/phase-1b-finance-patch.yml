name: Phase 1B finance patch

on:
  push:
    branches:
      - phase-1b-academy-tenant-ownership

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1b-academy-tenant-ownership
          fetch-depth: 0

      - name: Apply finance ownership patch
        run: python scripts/phase-1b-finance-patch.py

      - name: Commit finance ownership patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma apps/api/src/database/prisma.service.ts apps/api/src/billing/billing.service.ts
          if git diff --cached --quiet; then
            echo "No finance patch changes required."
            exit 0
          fi
          git commit -m "Add Phase 1B finance ownership to Prisma"
          git push origin HEAD:phase-1b-academy-tenant-ownership
