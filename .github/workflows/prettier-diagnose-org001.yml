name: Prettier Diagnose Org001

on:
  push:
    branches:
      - feat/org001-compatibility

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier output
        run: pnpm exec prettier tests/organization-tenancy.test.mjs
