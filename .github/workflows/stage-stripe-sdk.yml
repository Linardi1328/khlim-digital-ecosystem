name: Stage Stripe SDK

on:
  push:
    branches:
      - test/pre-alpha-stripe-sandbox

permissions:
  contents: write

jobs:
  dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/pre-alpha-stripe-sandbox

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Add pinned Stripe SDK
        run: pnpm --filter @khlim/api add stripe@22.5.0 --save-exact

      - name: Commit dependency files
        run: |
          if git diff --quiet -- apps/api/package.json pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/package.json pnpm-lock.yaml
          git commit -m "build(api): add Stripe SDK"
          git push origin HEAD:test/pre-alpha-stripe-sandbox
