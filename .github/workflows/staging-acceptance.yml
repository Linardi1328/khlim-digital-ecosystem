name: Staging Acceptance

on:
  workflow_dispatch:
    inputs:
      acceptance_mode:
        description: "Acceptance mode: 'both' (default), 'ric-65-hosted', or 'readiness-only'"
        type: choice
        options:
          - "both"
          - "ric-65-hosted"
          - "readiness-only"
        default: "both"
      active_window_authorized:
        description: "Authorize active mutation window for RIC-65 (default false runs non-mutating readiness gate only)"
        type: boolean
        required: true
        default: false

concurrency:
  group: ric-65-hosted-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    if: github.ref_name == 'staging/ric-65-academy-soft-launch'
    environment: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API and generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/build_only_inert
        run: pnpm --filter @khlim/api build
      - name: Verify deployed staging services and fail-closed configuration
        if: ${{ inputs.acceptance_mode != 'ric-65-hosted' }}
        env:
          KHLIM_STAGING_WEB_URL: ${{ secrets.KHLIM_STAGING_WEB_URL }}
          KHLIM_STAGING_API_URL: ${{ secrets.KHLIM_STAGING_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.KHLIM_STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.KHLIM_STAGING_SUPABASE_ANON_KEY }}
          PAYMENT_PROVIDER: billplz
          BILLPLZ_SANDBOX: "1"
          BILLPLZ_SECRET_KEY: ${{ secrets.KHLIM_STAGING_BILLPLZ_SECRET_KEY }}
          BILLPLZ_COLLECTION_ID: ${{ secrets.KHLIM_STAGING_BILLPLZ_COLLECTION_ID }}
          BILLPLZ_X_SIGNATURE_KEY: ${{ secrets.KHLIM_STAGING_BILLPLZ_X_SIGNATURE_KEY }}
          BILLPLZ_CALLBACK_URL: ${{ secrets.KHLIM_STAGING_BILLPLZ_CALLBACK_URL }}
          BILLPLZ_REDIRECT_URL: ${{ secrets.KHLIM_STAGING_BILLPLZ_REDIRECT_URL }}
        run: node scripts/verify-staging-acceptance.mjs
      - name: Execute RIC-65 hosted staging acceptance gate
        if: ${{ inputs.acceptance_mode != 'readiness-only' }}
        env:
          KHLIM_STAGING_API_URL: ${{ secrets.KHLIM_STAGING_API_URL }}
          KHLIM_STAGING_API_ALLOWLIST: ${{ secrets.KHLIM_STAGING_API_ALLOWLIST }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          KHLIM_STAGING_WEB_URL: ${{ secrets.KHLIM_STAGING_WEB_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.KHLIM_STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.KHLIM_STAGING_SUPABASE_ANON_KEY }}
          KHLIM_STAGING_ADMIN_AAL2_TOKEN: ${{ secrets.KHLIM_STAGING_ADMIN_AAL2_TOKEN }}
          KHLIM_STAGING_USER_AAL1_TOKEN: ${{ secrets.KHLIM_STAGING_USER_AAL1_TOKEN }}
          KHLIM_STAGING_DATABASE_URL: ${{ secrets.KHLIM_STAGING_DATABASE_URL }}
          KHLIM_STAGING_TEST_PHONE: ${{ secrets.KHLIM_STAGING_TEST_PHONE }}
          KHLIM_STAGING_APPROVED_TEST_PHONE: ${{ secrets.KHLIM_STAGING_APPROVED_TEST_PHONE }}
          KHLIM_STAGING_TARGET_BRANCH: ${{ github.ref_name }}
          KHLIM_STAGING_ACTIVE_WINDOW_AUTHORIZED: ${{ inputs.active_window_authorized && '1' || '0' }}
        run: node scripts/verify-hosted-staging-acceptance.mjs
