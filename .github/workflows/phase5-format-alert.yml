name: Phase 5 alert formatting helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-alert:
    if: github.head_ref == 'feat/phase-5-website-parent-portal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Alert component
        run: pnpm exec prettier --write apps/web/components/ui/alert.tsx

      - name: Commit formatter output
        run: |
          if git diff --quiet -- apps/web/components/ui/alert.tsx; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/ui/alert.tsx
          git commit -m "style: format Alert component"
          git push origin HEAD:${{ github.head_ref }}
