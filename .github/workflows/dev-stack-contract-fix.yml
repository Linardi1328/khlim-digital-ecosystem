name: Dev Stack Contract Fix

on:
  push:
    branches:
      - feat/payment-state-machine-hardening

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khlim_validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payment-state-machine-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Normalize staged sources
        run: |
          if [ -f scripts/verify-staging-acceptance.mjs ]; then
            pnpm exec prettier --write scripts/verify-staging-acceptance.mjs
          fi
      - name: Regenerate OpenAPI artifacts
        run: pnpm openapi:generate
      - name: Commit repairs locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi/khlim-v1.json packages/api-client/src/schema.d.ts
          if [ -f scripts/verify-staging-acceptance.mjs ]; then
            git add scripts/verify-staging-acceptance.mjs
          fi
          if git diff --cached --quiet; then
            echo "No repair changes required"
          else
            git commit -m "chore(ci): refresh generated contract and formatting"
          fi
      - name: Validate repaired branch
        run: |
          pnpm format:check
          pnpm openapi:check
      - name: Push repairs
        run: git push origin HEAD:feat/payment-state-machine-hardening
