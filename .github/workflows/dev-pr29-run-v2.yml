name: Dev PR29 Verified Runner

on:
  push:
    branches:
      - feat/payment-state-machine-hardening

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: khlim
          POSTGRES_PASSWORD: khlim
          POSTGRES_DB: khlim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khlim -d khlim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://khlim:khlim@127.0.0.1:5432/khlim_test
      DIRECT_URL: postgresql://khlim:khlim@127.0.0.1:5432/khlim_test
      KHLIM_TEST_DATABASE: "1"
      PAYMENT_PROVIDER: sandbox
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payment-state-machine-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply staged payment hardening patch
        run: |
          awk '/^[[:space:]]*python <<'"'"'PY'"'"'$/{capture=1;next} /^[[:space:]]*PY$/{if(capture){exit}} capture{sub(/^          /, ""); print}' .github/workflows/dev-pr29-payment-hardening.yml > /tmp/pr29-patch.py
          python /tmp/pr29-patch.py

      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          apps/api/src/billing/billing.service.ts
          apps/api/src/billing/billing.controller.ts
          tests/phase-4-billing-payments.test.mjs
          tests/integration/pre-alpha-payment-webhook-integration.test.mjs

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy

      - name: Verify PR29
        run: |
          pnpm test
          pnpm lint
          pnpm format:check
          pnpm prisma:generate
          pnpm --filter @khlim/api build
          node --test tests/integration/pre-alpha-payment-webhook-integration.test.mjs

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/billing/billing.service.ts apps/api/src/billing/billing.controller.ts tests/phase-4-billing-payments.test.mjs tests/integration/pre-alpha-payment-webhook-integration.test.mjs
          git commit -m "feat(billing): harden payment state ordering and stale holds"
          git push origin HEAD:feat/payment-state-machine-hardening
