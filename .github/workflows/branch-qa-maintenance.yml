name: Branch QA Maintenance

on:
  push:
    branches:
      - feat/phase-5-homepage-gallery-carousel

permissions:
  contents: write

jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-5-homepage-gallery-carousel

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Pin Playwright test runner
        run: pnpm add -Dw @playwright/test@1.55.0

      - name: Format branch
        run: pnpm format

      - name: Commit maintenance changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml apps/web/components/layout/public-header.tsx tests/e2e/web-preview.spec.mjs .github/workflows/web-preview-e2e.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(web): finalize browser QA tooling and formatting"
          git push origin HEAD:feat/phase-5-homepage-gallery-carousel
