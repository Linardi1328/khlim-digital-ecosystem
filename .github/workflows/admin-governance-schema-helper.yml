name: Admin Governance Schema Helper

on:
  push:
    branches:
      - feat/admin-audit-settings

permissions:
  contents: write

jobs:
  patch-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-audit-settings
      - name: Wire transactional identity audit events once
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("apps/api/src/admin/admin.service.ts")
          text = path.read_text()
          if 'action: "STAFF_ROLES_REPLACED"' in text and 'action: "ACCOUNT_STATUS_UPDATED"' in text:
              print("Identity audit events already wired")
              raise SystemExit(0)

          role_pattern = re.compile(
              r'return transaction\.userRoleAssignment\.findMany\(\{\s*where: \{ userId \},\s*select: \{ role: true \},\s*orderBy: \{ role: "asc" \},\s*\}\);',
              re.MULTILINE,
          )
          role_replacement = '''const assignments = await transaction.userRoleAssignment.findMany({
                where: { userId },
                select: { role: true },
                orderBy: { role: "asc" },
              });

              await transaction.auditEvent.create({
                data: {
                  actorUserId: actor.id,
                  actorEmail: actor.email,
                  actorRoles: actor.roles.join(", ") || "STAFF",
                  action: "STAFF_ROLES_REPLACED",
                  entityType: "USER",
                  entityId: userId,
                  summary: `Staff roles for ${target.email ?? userId} changed from ${targetRoles.join(", ") || "none"} to ${roles.join(", ") || "none"}.`,
                  metadata: {
                    before: targetRoles,
                    after: assignments.map((assignment) => assignment.role),
                  },
                },
              });

              return assignments;'''
          if 'action: "STAFF_ROLES_REPLACED"' not in text:
              text, role_count = role_pattern.subn(role_replacement, text, count=1)
              if role_count != 1:
                  raise SystemExit(f"Expected one staff-role block, found {role_count}")

          status_pattern = re.compile(
              r'return this\.prisma\.client\.user\.update\(\{\s*where: \{ id: userId \},\s*data: \{ status: body\.status as "ACTIVE" \| "SUSPENDED" \| "DEACTIVATED" \},\s*select: \{\s*id: true,\s*status: true,\s*updatedAt: true,\s*\},\s*\}\);',
              re.MULTILINE,
          )
          status_replacement = '''return this.prisma.client.$transaction(async (transaction) => {
              const updated = await transaction.user.update({
                where: { id: userId },
                data: {
                  status: body.status as "ACTIVE" | "SUSPENDED" | "DEACTIVATED",
                },
                select: {
                  id: true,
                  status: true,
                  updatedAt: true,
                },
              });

              await transaction.auditEvent.create({
                data: {
                  actorUserId: actor.id,
                  actorEmail: actor.email,
                  actorRoles: actor.roles.join(", ") || "STAFF",
                  action: "ACCOUNT_STATUS_UPDATED",
                  entityType: "USER",
                  entityId: userId,
                  summary: `Account status for ${target.email ?? userId} changed from ${target.status} to ${updated.status}.`,
                  metadata: {
                    before: { status: target.status },
                    after: { status: updated.status },
                  },
                },
              });

              return updated;
            });'''
          if 'action: "ACCOUNT_STATUS_UPDATED"' not in text:
              text, status_count = status_pattern.subn(status_replacement, text, count=1)
              if status_count != 1:
                  raise SystemExit(f"Expected one account-status block, found {status_count}")

          path.write_text(text)
          PY
          if git diff --quiet -- apps/api/src/admin/admin.service.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/admin/admin.service.ts
          git commit -m "feat(governance): audit privileged identity changes"
          git push origin HEAD:feat/admin-audit-settings
