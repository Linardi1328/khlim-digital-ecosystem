name: Temporary PR55 owner-gate repair

on:
  push:
    branches:
      - milestone-real-admin-multirole

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-real-admin-multirole
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Align browser contracts with work-view semantics
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          for (const path of [
            'tests/e2e/admin-kpi-observability.spec.mjs',
            'tests/e2e/admin-ui.spec.mjs',
          ]) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes('Switch demo role')) {
              throw new Error(`Expected stale role-switch label missing in ${path}`);
            }
            fs.writeFileSync(
              path,
              source.replaceAll('Switch demo role', 'Switch active work view'),
            );
          }
          NODE
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Format PR55 gate files
        run: >-
          pnpm exec prettier --write
          apps/admin/lib/admin-api.ts
          apps/admin/lib/types.ts
          apps/api/src/admin/admin-operations-data.controller.ts
          apps/api/src/admin/admin-operations-data.service.ts
          tests/e2e/admin-kpi-observability.spec.mjs
          tests/e2e/admin-ui.spec.mjs
      - name: Remove temporary repair workflow
        run: rm .github/workflows/temp-real-admin-normalize.yml
      - name: Commit repaired owner-gate output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix PR55 owner gates"
          git push origin HEAD:milestone-real-admin-multirole
