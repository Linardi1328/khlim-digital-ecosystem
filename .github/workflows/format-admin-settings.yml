name: Format Admin Settings

on:
  push:
    branches:
      - feat/phase-6-admin-operations-ui

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-6-admin-operations-ui

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format settings page
        run: pnpm exec prettier --write apps/admin/app/settings/page.tsx

      - name: Commit formatted settings page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/app/settings/page.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(admin): format settings page"
          git push origin HEAD:feat/phase-6-admin-operations-ui
