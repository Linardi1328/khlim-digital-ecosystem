name: RIC-65 Hosted Staging Acceptance

on:
  workflow_dispatch:
    inputs:
      active_window_authorized:
        description: "Authorize active mutation window (submits synthetic leads, verifies duplicate idempotency receipts, and validates single-record persistence). If false, runs non-mutating readiness gate only."
        type: boolean
        required: true
        default: false

concurrency:
  group: ric-65-hosted-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hosted-staging-acceptance:
    name: Hosted Staging Acceptance Gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging/ric-119-120-readonly-20261124'
    environment: staging
    steps:
      - name: Require approved runner dispatch
        env:
          KHLIM_STAGING_EXPECTED_COMMIT_SHA: ${{ vars.KHLIM_STAGING_EXPECTED_COMMIT_SHA }}
          KHLIM_STAGING_EXPECTED_RUNNER_SHA: ${{ vars.KHLIM_STAGING_EXPECTED_RUNNER_SHA }}
        shell: bash
        run: |
          approved_runner="${KHLIM_STAGING_EXPECTED_RUNNER_SHA:-$KHLIM_STAGING_EXPECTED_COMMIT_SHA}"
          if [[ ! "$KHLIM_STAGING_EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ||
                ! "$approved_runner" =~ ^[0-9a-f]{40}$ || "$GITHUB_SHA" != "$approved_runner" ]]; then
            echo "Dispatch does not match the approved staging runner SHA"
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checked-out commit
        shell: bash
        run: test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API and generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/build_only_inert
        run: pnpm --filter @khlim/api build

      - name: Execute hosted staging acceptance runner
        env:
          KHLIM_STAGING_API_URL: ${{ secrets.KHLIM_STAGING_API_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.KHLIM_STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.KHLIM_STAGING_SUPABASE_ANON_KEY }}
          KHLIM_STAGING_ADMIN_AAL2_TOKEN: ${{ inputs.active_window_authorized == true && secrets.KHLIM_STAGING_ADMIN_AAL2_TOKEN || '' }}
          KHLIM_STAGING_USER_AAL1_TOKEN: ${{ inputs.active_window_authorized == true && secrets.KHLIM_STAGING_USER_AAL1_TOKEN || '' }}
          KHLIM_STAGING_APPROVED_USER_SUBJECT: ${{ inputs.active_window_authorized == true && secrets.KHLIM_STAGING_APPROVED_USER_SUBJECT || '' }}
          KHLIM_STAGING_APPROVED_ADMIN_SUBJECT: ${{ inputs.active_window_authorized == true && secrets.KHLIM_STAGING_APPROVED_ADMIN_SUBJECT || '' }}
          KHLIM_STAGING_DATABASE_URL: ${{ inputs.active_window_authorized == true && secrets.KHLIM_STAGING_DATABASE_URL || '' }}
          KHLIM_STAGING_TEST_PHONE: ${{ inputs.active_window_authorized == true && secrets.KHLIM_STAGING_TEST_PHONE || '' }}
          KHLIM_STAGING_APPROVED_TEST_PHONE: ${{ inputs.active_window_authorized == true && secrets.KHLIM_STAGING_APPROVED_TEST_PHONE || '' }}
          KHLIM_STAGING_TARGET_BRANCH: ${{ github.ref }}
          KHLIM_STAGING_ACTIVE_WINDOW_AUTHORIZED: ${{ inputs.active_window_authorized == true && '1' || '0' }}
          KHLIM_STAGING_VERCEL_TOKEN: ${{ secrets.KHLIM_STAGING_VERCEL_TOKEN }}
          KHLIM_STAGING_EXPECTED_COMMIT_SHA: ${{ vars.KHLIM_STAGING_EXPECTED_COMMIT_SHA }}
          KHLIM_STAGING_EXPECTED_RUNNER_SHA: ${{ vars.KHLIM_STAGING_EXPECTED_RUNNER_SHA }}
          KHLIM_STAGING_DEPLOYMENT_ID: ${{ vars.KHLIM_STAGING_DEPLOYMENT_ID }}
        run: node scripts/verify-hosted-staging-acceptance.mjs
