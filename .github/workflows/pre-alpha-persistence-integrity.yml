name: Pre-Alpha Persistence Integrity

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  persistence-integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: khlim_pre_alpha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d khlim_pre_alpha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khlim_pre_alpha_test
      KHLIM_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run persistence-backed pre-alpha tests
        run: pnpm test:pre-alpha:persistence
