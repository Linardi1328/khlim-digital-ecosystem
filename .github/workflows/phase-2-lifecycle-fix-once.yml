name: Phase 2 lifecycle fix once

on:
  push:
    branches:
      - phase-2-complete-persisted-admin-writes

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2-complete-persisted-admin-writes

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Restrict inactive Offering transitions
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path("apps/admin/app/offerings/page.tsx")
          page = page_path.read_text()
          old = '''          <Button
            variant="outline"
            size="sm"
            onClick={(event) => {
              event.stopPropagation();
              setStateChangeOffering({
                offering,
                targetStatus: offering.status === "OPEN" ? "CLOSED" : "OPEN",
              });
            }}
          >
            {offering.status === "OPEN" ? "Close" : "Open"}
          </Button>'''
          new = '''          {offering.status !== "INACTIVE" && (
            <Button
              variant="outline"
              size="sm"
              onClick={(event) => {
                event.stopPropagation();
                setStateChangeOffering({
                  offering,
                  targetStatus: offering.status === "OPEN" ? "CLOSED" : "OPEN",
                });
              }}
            >
              {offering.status === "OPEN" ? "Close" : "Open"}
            </Button>
          )}'''
          if old not in page:
              raise SystemExit("Offering action block not found")
          page_path.write_text(page.replace(old, new, 1))

          test_path = Path("tests/phase-2-admin-persisted-writes.test.mjs")
          test = test_path.read_text()
          marker = "  assert.match(page, /await updateOfferingStatus/);\n"
          addition = marker + '  assert.match(page, /offering\\.status !== "INACTIVE"/);\n'
          if marker not in test:
              raise SystemExit("Offering regression marker not found")
          test_path.write_text(test.replace(marker, addition, 1))
          PY

          pnpm exec prettier --write \
            apps/admin/app/offerings/page.tsx \
            tests/phase-2-admin-persisted-writes.test.mjs

      - name: Commit lifecycle fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/app/offerings/page.tsx tests/phase-2-admin-persisted-writes.test.mjs
          git commit -m "Preserve inactive Offering lifecycle semantics"
          git push origin HEAD:phase-2-complete-persisted-admin-writes
