name: Temporary Auth UX Formatter

on:
  push:
    branches:
      - feat/lab-validated-auth-localization-ux

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lab-validated-auth-localization-ux
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Format auth UX component
        run: pnpm exec prettier --write apps/web/components/ui/password-input.tsx
      - name: Commit formatter output when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/ui/password-input.tsx
          git commit -m "style: apply Prettier to auth UX"
          git push
