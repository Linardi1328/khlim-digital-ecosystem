name: Temporary PR55 E2E formatting

on:
  push:
    branches:
      - milestone-real-admin-multirole

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-real-admin-multirole
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply pinned repository formatter
        run: >-
          pnpm exec prettier --write
          tests/e2e/admin-kpi-observability.spec.mjs
          tests/e2e/admin-ui.spec.mjs
      - name: Remove temporary formatter workflow
        run: rm .github/workflows/temp-pr55-e2e-format.yml
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format PR55 work-view E2E gates"
          git push origin HEAD:milestone-real-admin-multirole
